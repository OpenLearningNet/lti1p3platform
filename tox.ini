[tox]
isolated_build = True
envlist = py310, py311, py312, py313

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
allowlist_externals = poetry
commands =
    poetry install -vvv
    pylint --rcfile=.pylintrc lti1p3platform tests examples
    mypy lti1p3platform
    black . --check --diff
    pytest tests
